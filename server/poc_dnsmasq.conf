interface=@interface@
except-interface=lo
bind-interfaces
no-hosts
no-resolv
server=1.1.1.1
log-queries
log-dhcp
log-facility=@tmp_dir@/dnsmasq.log
dhcp-range=@wifi_net@.50,@wifi_net@.100,1h
dhcp-leasefile=@tmp_dir@/dnsmasq.leases